[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamcavendish/aioduct"

[workspace.dependencies]
aioduct = { path = "crates/aioduct" }

async-io = "2"
base64 = "0.22"
brotli = { version = "8", default-features = false }
bytes = "1"
clap = "4"
compio-driver = { version = "0.11", default-features = false }
compio-runtime = "0.11"
encoding_rs = "0.8"
flate2 = "1"
futures-core = "0.3"
futures-io = "0.3"
futures-util = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-resolver = "0.26"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
indicatif = "0.18"
js-sys = "0.3"
memchr = "2"
mime = "0.3"
opentelemetry = { version = "0.31", default-features = false }
opentelemetry-http = "0.31"
opentelemetry-stdout = "0.31"
opentelemetry_sdk = "0.31"
percent-encoding = "2"
pin-project-lite = "0.2"
quinn = { version = "0.11", default-features = false }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
smol = "2"
socket2 = "0.6"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26"
tower-layer = "0.3"
tower-service = "0.3"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = "0.3"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
webpki-roots = "1"
zstd = { version = "0.13", default-features = false }
