[workspace]
members = ["crates/*", "examples/*/*"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamcavendish/aioduct"

[workspace.dependencies]
aioduct = { path = "crates/aioduct" }
aioduct-test-server = { path = "crates/aioduct-test-server" }

async-io = "2"
base64 = "0.22"
brotli = { version = "8", default-features = false }
bytes = "1"
coarsetime = "0.1"
clap = "4"
compio-driver = { version = "0.11", default-features = false }
compio-io = { version = "0.9", default-features = false }
compio-net = "0.11"
compio-runtime = "0.11"
crossterm = "0.29"
encoding_rs = "0.8"
flate2 = "1"
futures-channel = "0.3"
futures-core = "0.3"
futures-io = "0.3"
futures-util = "0.3"
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
x509-parser = { version = "0.17", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
indicatif = "0.18"
js-sys = "0.3"
memchr = "2"
mime = "0.3"
opentelemetry = { version = "0.32", default-features = false }
opentelemetry-http = "0.32"
opentelemetry-stdout = "0.32"
opentelemetry_sdk = "0.32"
paste = "1"
percent-encoding = "2"
pin-project-lite = "0.2"
quinn = { version = "0.11", default-features = false }
ratatui = "0.30"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
smol = "2"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = "1"
tokio-rustls = "0.26"
tokio-util = "0.7"
tower-layer = "0.3"
tower-service = "0.3"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = "0.3"
url = "2"
wasi = "0.14"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
webpki-roots = "1"
zstd = { version = "0.13", default-features = false }

[profile.dev]
debug = false

[profile.bench]
lto = "thin"
