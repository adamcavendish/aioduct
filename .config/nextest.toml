[profile.default]
slow-timeout = { period = "3s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "test(bandwidth_limiter_should_not_busy_loop) | test(test_connect_tunnel)"
slow-timeout = { period = "10s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "test(write_timeout_triggers_on_slow_server) | test(write_timeout_not_retried) | test(blocking_send_error)"
slow-timeout = { period = "10s", terminate-after = 2 }

[[profile.default.overrides]]
# This test deliberately starts 64 OS threads sharing the test's Tokio runtime.
filter = "test(request_callbacks_work_across_64_concurrent_threads)"
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Guest end-to-end tests build a WASI component before executing it.
filter = "binary(wasmtime_guest_e2e)"
slow-timeout = { period = "30s", terminate-after = 2 }
# These tests relay a sustained upload through an intentionally throttled TLS
# tunnel. Full-suite contention can exceed the global six-second kill limit.
[[profile.default.overrides]]
filter = "test(forward_real_incoming_multipart_through_https_proxy_reuses_fresh_tunnel_send) | test(forward_real_incoming_multipart_through_https_proxy_reuses_fresh_https_h2_tunnel_send) | test(compio_forward_local_real_incoming_multipart_through_https_proxy_reuses_fresh_tunnel) | test(compio_forward_local_real_incoming_multipart_through_https_proxy_reuses_fresh_https_h2_tunnel)"
slow-timeout = { period = "30s", terminate-after = 2 }
