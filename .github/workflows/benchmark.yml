name: Benchmark

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Criterion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark

      - name: Restore benchmark history
        uses: actions/cache/restore@v4
        with:
          path: .benchmark-cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-${{ github.ref_name }}-

      - name: Run benchmarks
        run: |
          mkdir -p .benchmark-cache
          cargo bench -p aioduct-bench --bench bench_main \
            -- --output-format bencher --noplot --color never \
            | tee output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: aioduct benchmarks
          tool: cargo
          output-file-path: output.txt
          external-data-json-path: .benchmark-cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          comment-on-alert: true
          # GitHub-hosted runner timings vary enough to produce correlated
          # 2x swings across aioduct and every comparison client. Keep the
          # alert and history, but do not fail main on one absolute sample.
          fail-on-alert: false
          alert-threshold: "200%"

      - name: Save benchmark history
        uses: actions/cache/save@v4
        with:
          path: .benchmark-cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}

      - name: Trigger Pages deployment
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
