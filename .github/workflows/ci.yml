name: CI

on:
  push:
    branches: [master, dev-0.2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  rust_min: "1.95.0"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@just
      - run: just fmt-check

  clippy:
    name: Clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: all-features
      - uses: taiki-e/install-action@just
      - run: just clippy-all

  clippy-isolated:
    name: Clippy (isolated runtimes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just clippy

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just doc-check

  mdbook:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@mdbook
      - run: just book

  basics:
    name: Basics
    runs-on: ubuntu-latest
    needs: [fmt, clippy, clippy-isolated, doc]
    steps:
      - run: exit 0

  test:
    name: Test (${{ matrix.crypto }})
    runs-on: ubuntu-latest
    needs: [basics]
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: ring
            features: "json,charset,rustls,rustls-ring,rustls-native-roots,hickory-dns,blocking,tokio,smol,compio,http3,gzip,brotli,zstd,deflate,tower,tracing,otel,wasm,wasi-p2"
            adapter_args: "--no-default-features --features tokio,rustls-ring"
          - crypto: aws-lc-rs
            features: "json,charset,rustls,rustls-aws-lc-rs,rustls-native-roots,hickory-dns,blocking,tokio,smol,compio,http3,gzip,brotli,zstd,deflate,tower,tracing,otel,wasm,wasi-p2"
            adapter_args: "--no-default-features --features tokio,rustls-aws-lc-rs"
          - crypto: smol-ring
            features: "json,charset,rustls,rustls-ring,rustls-native-roots,hickory-dns,blocking,tokio,smol,compio,http3,gzip,brotli,zstd,deflate,tower,tracing,otel,wasm,wasi-p2"
            adapter_args: "--no-default-features --features smol,rustls-ring"
          - crypto: compio-ring
            features: "json,charset,rustls,rustls-ring,rustls-native-roots,hickory-dns,blocking,tokio,smol,compio,http3,gzip,brotli,zstd,deflate,tower,tracing,otel,wasm,wasi-p2"
            adapter_args: "--no-default-features --features compio,rustls-ring"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: all-features
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p aioduct --features ${{ matrix.features }}
      - run: cargo nextest run -p aioduct-wasmtime ${{ matrix.adapter_args }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [basics]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest -p aioduct --features "json,charset,rustls,rustls-ring,rustls-native-roots,hickory-dns,blocking,tokio,smol,compio,http3,gzip,brotli,zstd,deflate,tower,tracing,otel,wasm,wasi-p2" --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [basics]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_min }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just msrv

  wasm:
    name: WASM tests
    runs-on: ubuntu-latest
    needs: [basics]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - name: Verify wasm32 portable modules compile
        run: cargo check -p aioduct --target wasm32-unknown-unknown --features wasm,json,gzip,brotli,deflate
      - name: Verify wasm32-wasip2 compilation
        run: cargo check -p aioduct --target wasm32-wasip2 --features wasi-p2,json,gzip,brotli,deflate
      - name: Build and start test server
        run: |
          cargo run -p wasm-test-server &
          sleep 2
      - name: Run WASM integration tests
        run: cd crates/aioduct && wasm-pack test --headless --chrome --features wasm,json

  wasi:
    name: WASI-P2 tests
    runs-on: ubuntu-latest
    needs: [basics]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasmtime
      - name: Run WASI-P2 unit tests
        run: |
          CARGO_TARGET_WASM32_WASIP2_RUNNER="wasmtime run --" \
            cargo test -p aioduct --target wasm32-wasip2 --features wasi-p2,json --lib

  snippet-check:
    name: Site snippet build check
    runs-on: ubuntu-latest
    needs: [basics]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-snippets.sh --verbose

  cross-check:
    name: Check (${{ join(matrix.targets, ', ') }})
    runs-on: ${{ matrix.os }}
    needs: [basics]
    strategy:
      fail-fast: false
      matrix:
        include:
          - targets:
              - aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - targets:
              - x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - targets:
              - aarch64-apple-darwin
              - x86_64-apple-darwin
            os: macos-latest
          - targets:
              - x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ join(matrix.targets, ',') }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilers (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-check targets
        run: |
          for target in ${{ join(matrix.targets, ' ') }}; do
            echo "::group::cargo check --target $target"
            cargo check -p aioduct-cli --target "$target"
            echo "::endgroup::"
          done
