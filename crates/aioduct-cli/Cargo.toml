[package]
name = "aioduct-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified CLI for aioduct — parallel downloads and HTTP requests"
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "aioduct"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
aioduct = { workspace = true, features = [
    "tokio",
    "rustls",
    "rustls-ring",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
    "json",
] }
clap = { workspace = true, features = ["derive"] }
crossterm.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "signal"] }
indicatif = { workspace = true, features = ["tokio"] }
hex.workspace = true
http.workspace = true
quick-xml.workspace = true
ratatui.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
