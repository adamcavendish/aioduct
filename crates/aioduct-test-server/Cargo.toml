[package]
name = "aioduct-test-server"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
rustls = ["dep:rustls", "dep:rcgen", "dep:tokio-rustls", "rustls/ring"]
http3 = ["rustls", "dep:h3", "dep:h3-quinn", "dep:quinn"]

[dependencies]
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
pin-project-lite.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "time", "macros", "io-util", "sync"] }

# TLS (optional)
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, features = ["std", "tls12"], optional = true }
tokio-rustls = { workspace = true, optional = true }

# H3 (optional)
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
