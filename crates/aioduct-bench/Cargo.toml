[package]
name = "aioduct-bench"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aioduct = { workspace = true, features = ["tokio", "smol", "compio", "json", "rustls", "rustls-ring", "__bench"] }
bytes.workspace = true
compio-runtime.workspace = true
criterion = { version = "0.8", features = ["async_tokio", "async_smol"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "multipart"] }
serde = { workspace = true, features = ["derive"] }
smol.workspace = true
tokio = { workspace = true, features = ["full"] }

[target.'cfg(not(target_env = "musl"))'.dependencies]
isahc = "1"

[[bench]]
name = "bench_main"
harness = false
