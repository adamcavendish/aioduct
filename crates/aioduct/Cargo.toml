[package]
name = "aioduct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Async-native HTTP client built directly on hyper 1.x — no hyper-util, no legacy"
readme = "../../README.md"
keywords = ["http", "client", "async", "hyper", "rustls"]
categories = ["network-programming", "web-programming::http-client"]
exclude = ["docs/", "target/"]

[features]
default = []
precise-timing = []
json = ["dep:serde", "dep:serde_json", "dep:serde_urlencoded"]
charset = ["dep:encoding_rs", "dep:mime"]
rustls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile", "dep:x509-parser"]
rustls-ring = ["rustls?/ring", "quinn?/rustls-ring"]
rustls-aws-lc-rs = ["rustls?/aws-lc-rs", "quinn?/rustls-aws-lc-rs"]
rustls-native-roots = ["rustls", "dep:rustls-native-certs"]
# Note: hickory-dns implies tokio (hickory-resolver requires tokio)
hickory-dns = ["dep:hickory-resolver", "tokio"]
# DoH/DoT: encrypted DNS via hickory-resolver's HTTPS/TLS transport
doh = ["hickory-dns", "hickory-resolver/https-ring", "hickory-resolver/webpki-roots"]
dot = ["hickory-dns", "hickory-resolver/tls-ring", "hickory-resolver/webpki-roots"]
blocking = []
tokio = ["dep:tokio"]
smol = ["dep:smol", "dep:async-io", "dep:futures-io"]
compio = ["dep:compio-runtime", "dep:compio-driver", "dep:compio-net", "dep:compio-io", "dep:async-io", "dep:futures-io"]
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn", "dep:futures-util"]
gzip = ["dep:flate2"]
brotli = ["dep:brotli"]
zstd = ["dep:zstd"]
deflate = ["dep:flate2"]
tower = ["dep:tower-service", "dep:tower-layer"]
tracing = ["dep:tracing"]
otel = ["dep:opentelemetry", "dep:opentelemetry-http"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
wasi-p2 = ["dep:wasi"]
wasmtime = [
    "dep:async-io",
    "dep:futures-util",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:wasmtime-wasi-http",
]
# Internal: lets companion crates type-check against portable/native types while
# still requiring end users of aioduct itself to select an actual runtime.
__internal-no-runtime = []
# Internal: expose pool internals for benchmarking (not part of public API)
__bench = []

[dependencies]
base64.workspace = true
brotli = { workspace = true, features = ["std"], optional = true }
bytes.workspace = true
coarsetime.workspace = true
compio-driver = { workspace = true, features = ["polling"], optional = true }
compio-io = { workspace = true, features = ["compat"], optional = true }
compio-net = { workspace = true, optional = true }
compio-runtime = { workspace = true, features = ["time"], optional = true }
encoding_rs = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
futures-channel.workspace = true
futures-core.workspace = true
futures-io = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
h2.workspace = true
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
js-sys = { workspace = true, optional = true }
memchr.workspace = true
mime = { workspace = true, optional = true }
opentelemetry = { workspace = true, features = ["trace"], optional = true }
opentelemetry-http = { workspace = true, optional = true }
percent-encoding.workspace = true
pin-project-lite.workspace = true
quinn = { workspace = true, optional = true }
rustls = { workspace = true, features = ["std", "tls12"], optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "io-util", "sync"], optional = true }
tower-layer = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"], optional = true }
url.workspace = true
wasi = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Headers", "Request", "RequestInit", "RequestMode",
    "Response", "Window", "WorkerGlobalScope", "ReadableStream", "ReadableStreamDefaultReader",
    "AbortController", "AbortSignal",
] }
webpki-roots = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = { workspace = true, optional = true }
socket2.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, features = ["p2"], optional = true }
wasmtime-wasi-http = { workspace = true, features = ["p2"], optional = true }

[dev-dependencies]
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen-test.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aioduct-test-server = { workspace = true, features = ["http3"] }
async-io.workspace = true
flate2.workspace = true
futures-io.workspace = true
futures-util.workspace = true
hyper = { workspace = true, features = ["server"] }
paste.workspace = true
quinn = { workspace = true, features = ["runtime-tokio"] }
rcgen.workspace = true
rustls = { workspace = true, features = ["std", "tls12"] }
smol.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "time", "macros", "io-util", "sync"] }
tokio-rustls.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wasmtime = { workspace = true, features = ["cranelift"] }
wasmtime-wasi = { workspace = true, features = ["p2"] }
wasmtime-wasi-http = { workspace = true, features = ["p2"] }

[package.metadata.docs.rs]
features = [
    "json",
    "charset",
    "rustls",
    "rustls-ring",
    "rustls-native-roots",
    "hickory-dns",
    "doh",
    "dot",
    "blocking",
    "tokio",
    "smol",
    "compio",
    "http3",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
    "tower",
    "tracing",
    "otel",
    "wasm",
    "wasi-p2",
    "wasmtime",
]
rustdoc-args = ["--cfg", "docsrs"]
